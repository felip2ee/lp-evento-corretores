server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Assets do Vite têm hash no nome, podem ser cacheados agressivamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Config em runtime: a imagem do nginx troca os ${VITE_...} pelas variáveis
    # de ambiente do container na subida (este arquivo é um template).
    location = /env.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        return 200 'window.__ENV={GTM_ID:"${VITE_GTM_ID}",WEBHOOK_URL:"${VITE_WEBHOOK_URL}",WHATSAPP_URL:"${VITE_WHATSAPP_URL}"};';
    }

    # Sem a barra no fim o nginx redirecionaria; aqui entrega direto e mantém os UTMs
    location = /corretores-de-seguro {
        add_header Cache-Control "no-cache";
        try_files /corretores-de-seguro/index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
