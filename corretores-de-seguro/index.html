<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- GTM é carregado em src/main.jsx a partir de VITE_GTM_ID (variável do container, via /env.js) -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" as="image" href="/assets/eliane-hero.webp">

  </head>
  <body>
    <div id="root"></div>
