<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- GTM é carregado em src/main.jsx a partir de VITE_GTM_ID (.env) -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex, nofollow" />
    <title>Chá com a Rainha do Crédito | Edição especial para corretores de imóveis</title>

    <meta property="og:title" content="Chá com a Rainha do Crédito | Edição especial para corretores" />
